# Development override for the UI E2E suite, applied on top of docker-compose.yml:
#
#   docker compose -p racingbettingsyndicate-dev -f docker-compose.yml -f docker-compose.dev.yml up --build -d --wait
#
# frontend/e2e-ui/run.sh starts it this way when UI_E2E_BASE_URL is not set, with the first admin
# (RBS_ADMIN_USERNAME, RBS_ADMIN_PASSWORD) set to a password it generates for the run. The ports
# stay those of docker-compose.yml: backend 8420 and frontend 3420. Port 9323 is kept for
# Playwright UI mode.
services:
  backend:
    image: racingbettingsyndicate-dev-backend:local
    container_name: racingbettingsyndicate-dev-backend
    restart: "no"
    # A throwaway database: /data is in memory and is empty every time the container starts.
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          mode: 0o1777
    environment:
      # The stack is served over plain HTTP.
      - RBS_COOKIE_SECURE=false
    # Checked often, so `up --wait` returns as soon as the backend is ready.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  frontend:
    image: racingbettingsyndicate-dev-frontend:local
    container_name: racingbettingsyndicate-dev-frontend
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3420/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
