# Configuration file for yamllint.
# Documentation: https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

# *.lock.yml is compiled by the `gh aw` CLI, not hand-authored;
# `gh aw compile --yamllint` validates it instead.
# node_modules: the "Check YAML" task scans the whole workspace, and
# MegaLinter's eslint pre-command creates frontend/node_modules mid-run.
ignore: |
  .github/workflows/*.lock.yml
  node_modules/

rules:
  comments:
    min-spaces-from-content: 1
  document-start: disable
  line-length:
    max: 200
  # GitHub workflows use `on:` as a key.
  truthy:
    check-keys: false
