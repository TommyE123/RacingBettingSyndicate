# Configuration file for yamllint.
# Documentation: https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

ignore: |
  node_modules/

rules:
  comments:
    min-spaces-from-content: 1
  document-start: disable
  line-length:
    max: 200
  # GitHub workflows use `on:` as a key.
  truthy:
    check-keys: false
