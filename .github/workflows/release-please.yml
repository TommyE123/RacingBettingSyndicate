name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Maintains a standing "Release PR" that accumulates Conventional Commit
  # changes since the last release. Merging an ordinary PR to main only
  # updates that Release PR; the workflow publishes beta images but no
  # versioned or latest image for that commit.
  # Merging the Release PR itself is a push to main like any other, which
  # is what this job recognises and turns into the tag + GitHub Release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # The default GITHUB_TOKEN is deliberately prevented by GitHub from
      # triggering other workflow runs, so a Release PR authored with it
      # never gets its required checks (validate-title, unit-tests, ...)
      # run automatically and can never satisfy the Protect Main ruleset.
      # A PAT sidesteps that restriction and lets the Release PR behave
      # like any other PR.
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs when the release-please job actually created a release (i.e.
  # this push was the Release PR being merged) - never on an ordinary
  # application PR merging to main. Publishes one image per component; a
  # component whose build context does not exist yet (for example the frontend
  # before it is added) is skipped.
  docker-release:
    name: Publish ${{ matrix.component }} image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: racingbettingsyndicate-backend
            context: .
            dockerfile: ./Dockerfile
            marker: app/main.py
          - component: frontend
            image: racingbettingsyndicate-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            marker: frontend/package-lock.json

    steps:
      # Checkout the exact commit release-please just tagged (the default
      # ref for this push-triggered run).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect the component
        id: component
        env:
          MARKER: ${{ matrix.marker }}
        run: |
          if [ -f "$MARKER" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$MARKER does not exist yet; skipping this image."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Configure QEMU to support building images for multiple CPU architectures
      - name: Set up QEMU
        if: steps.component.outputs.present == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up Docker Buildx builder for advanced multi-platform builds
      - name: Set up Docker Buildx
        if: steps.component.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Authenticate to Docker Hub for pushing built images
      - name: Login to Docker Hub
        if: steps.component.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Authenticate to GitHub Container Registry (GHCR) for pushing images
      - name: Login to GHCR
        if: steps.component.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image metadata and tags for Docker registries. The version
      # tag comes directly from release-please's own output - it is never
      # recalculated here.
      - name: Extract metadata
        id: meta
        if: steps.component.outputs.present == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      # Build the Docker image for multiple platforms and push to registries
      - name: Build and push Docker image
        if: steps.component.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Publishes continuously-updated "beta" images reflecting the current
  # state of main after every successful Release Please run, including
  # release merges.
  beta-build:
    name: Publish ${{ matrix.component }} beta image
    needs: release-please
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: racingbettingsyndicate-backend
            context: .
            dockerfile: ./Dockerfile
            marker: app/main.py
          - component: frontend
            image: racingbettingsyndicate-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            marker: frontend/package-lock.json

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect the component
        id: component
        env:
          MARKER: ${{ matrix.marker }}
        run: |
          if [ -f "$MARKER" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$MARKER does not exist yet; skipping this image."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.component.outputs.present == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.component.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: steps.component.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: steps.component.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `beta` is mutable (always the current main); `beta-<shortsha>` is an
      # immutable tag for traceability, since a later push can overwrite `beta`.
      # Docker Hub intentionally keeps only the mutable beta tag to avoid
      # accumulating historical beta SHA tags in a second registry.
      - name: Extract Docker Hub metadata
        id: meta-dockerhub
        if: steps.component.outputs.present == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=beta

      - name: Extract GHCR metadata
        id: meta-ghcr
        if: steps.component.outputs.present == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=beta
            type=raw,value=beta-{{sha}}

      - name: Build and push Docker image
        if: steps.component.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta-dockerhub.outputs.tags }}
            ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Clean up old GHCR beta tags
        if: steps.component.outputs.present == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ matrix.image }}
          delete-tags: "^beta-[0-9a-f]{7}$"
          use-regex: true
          keep-n-tagged: 20
          exclude-tags: "^beta$|^latest$"
