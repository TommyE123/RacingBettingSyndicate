name: Production Smoke Test

# A reusable workflow invoked as a job from docker-build.yml (see the
# smoke-test job there), not a standalone trigger: workflow_run only fires
# using the workflow file already on the default branch, so it could never
# run for the PR that introduces this file. Running as a job in the same
# pull_request-triggered run avoids that.
#
# It tests the linux/amd64 backend image that docker-build.yml's build-amd64 job built from
# this commit and handed over as an artifact (no registry, no secrets), so it runs the same
# way for pull requests from forks. It starts the image and checks that the backend serves
# GET /health. Extend it with API checks, and a browser E2E suite against the frontend, as
# those are added. Any failing step fails this job.
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  smoke-test:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download the built image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image-amd64
          path: ${{ runner.temp }}/image

      - name: Load the built image
        run: docker load --input "${RUNNER_TEMP}/image/image.tar"

      - name: Start the image
        run: |
          docker run -d --name rbs-backend-smoke \
            -p 8421:8420 \
            -e PYTHONUNBUFFERED=1 \
            rbs-backend-test:amd64
          echo "Image: $(docker inspect --format '{{.Config.Image}} ({{.Image}})' rbs-backend-smoke)"

      - name: Wait for the service to become ready
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8421/health >/dev/null; then
              echo "Service is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The backend did not become ready within the timeout"
          exit 1

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs rbs-backend-smoke || true
          docker inspect rbs-backend-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f rbs-backend-smoke 2>/dev/null || true
