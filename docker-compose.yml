services:
  backend:
    # Our own published image (built and published by .github/workflows/release-please.yml),
    # not a third-party dependency. `docker compose up --build` builds it from this checkout.
    image: tommye123/racingbettingsyndicate-backend:latest
    build: .
    container_name: racingbettingsyndicate-backend
    restart: unless-stopped
    volumes:
      - backend-data:/data # Persistent data storage (named volume: initialised with the image's /data owned by the backend user)
    ports:
      - "8420:8420" # Backend API
    environment:
      - PYTHONUNBUFFERED=1
      # First admin login, created only while the database has no users. Set both in a local
      # .env file (never committed); they are ignored once any user exists.
      - RBS_ADMIN_USERNAME=${RBS_ADMIN_USERNAME:-}
      - RBS_ADMIN_PASSWORD=${RBS_ADMIN_PASSWORD:-}
      # Session cookies are HTTPS-only by default. Set to false when serving over plain HTTP.
      - RBS_COOKIE_SECURE=${RBS_COOKIE_SECURE:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8420/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: tommye123/racingbettingsyndicate-frontend:latest
    build: ./frontend
    container_name: racingbettingsyndicate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # The web UI passes /api requests to the backend over the Compose network.
      - BACKEND_URL=http://backend:8420
    ports:
      - "3420:3420" # Web UI

volumes:
  backend-data:
