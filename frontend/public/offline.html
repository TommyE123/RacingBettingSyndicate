<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0b" />
    <meta name="description" content="Racing Betting Syndicate is offline" />
    <title>Offline | Racing Betting Syndicate</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      body {
        align-items: center;
        background: #ffffff;
        color: #212636;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        text-align: center;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
      }
      .emblem {
        background: #635bff;
        border-radius: 16px;
        display: inline-flex;
        height: 64px;
        width: 64px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1.25rem 0 0.5rem;
      }
      p {
        color: #667085;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        background: #635bff;
        border: 0;
        border-radius: 12px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 0.625rem 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Inline so the page needs no other file while offline. -->
      <svg class="emblem" viewBox="0 0 256 256" aria-hidden="true">
        <g transform="translate(38.4 38.4) scale(0.7)">
          <path
            fill="#ffffff"
            d="M202.05,55A103.24,103.24,0,0,0,128,24h-8a8,8,0,0,0-8,8V59.53L11.81,121.19a8,8,0,0,0-2.59,11.05l13.78,22,.3.43a31.84,31.84,0,0,0,31.34,12.83c13.93-2.36,38.62-6.54,61.4,3.29l-26.6,36.57A84.71,84.71,0,0,1,69.34,194,8,8,0,1,0,58.67,206a103.32,103.32,0,0,0,69.26,26l2.17,0a104,104,0,0,0,72-177ZM124,112a12,12,0,1,1,12-12A12,12,0,0,1,124,112Z"
          />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        The syndicate needs a connection to show bets, returns and the leaderboard. Check your
        connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
